<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema MIP</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="Header">
        <h2> Sistema MIP (Monitoramento de Impressora em Python)</h2>
    </div>

    <div>
        <button class="btn-add-filter">Adicionar Filtro</button>

        <br><br>

        <div class=filters-tbl-printers id="filters-tbl-printers">
            <div id="filters-inputs">
                <label for="field">campo</label>
                <select id="field">
                    <option value="">Selecione...</option>
                    <!-- outros campos são adicionados por js-->
                </select>

                <label for="operator">Condição</label>
                <select id="operator">
                    <option value="igual">Igual</option> 
                    <option value="contem">Contém</option>
                </select>
                
                <!-- vai alterar para input ou select dependendo da opção no select campo-->
                <label for="value">Valor</label>
                <div id="value-container">
                    <!-- JS coloca input ou select aqui -->
                </div>

                <button type="button">Aplicar filtro</button>
            </div>

            <div id="filter-exibition">
                
            </div>

        </div>

        <br>

        <div class="tbl-container">
            <table id="tbl-printers">
                <thead>
                    <th>N° Serial</th>
                    <th>Modelo</th>
                    <th>Filial</th>
                    <th>Status</th>
                    <th>Ip</th>
                    <th>Contador</th>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <br>

    <button type="button" onclick="updateTblPrinters()"> Update Table</button>

    <button type="button" onclick="addRowTbl()"> Add Row</button>
    <script type="module" src="js/script.js"></script>
</body>
</html>
